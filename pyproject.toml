[project]
name = "ron-depreciation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "salt", email = "iamsaltgawd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
